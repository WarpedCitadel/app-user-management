      - .env
    ports:
      - "8080:8080"
  wc_dev:
    image: warpedcitadel/app-user-management:dev
    env_file:
      - .env
    ports:
      - "8080:8080"
  wc_prod:
    image: warpedcitadel/app-user-management:prod
    env_file:
      - .env
    ports:
      - "8080:8080"
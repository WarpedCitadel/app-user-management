# --- Application Configuration ---
spring.application.name=appusermanagement
spring.config.import=optional:file:.env[.properties]
#spring.main.banner-mode=off
spring.output.ansi.enabled=ALWAYS

# --- Http Configuration ---
spring.mvc.apiversion.use.header=X-API-Version
app.cors.allowed-origins=${CORS}

#Security Configuration
spring.security.user.name=${SEC_USERNAME}
spring.security.user.password=${SEC_PASSWORD}
#logging.level.org.springframework.security=DEBUG

# --- Database Configuration ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connectionTimeout=${CONN_TIMEOUT}
spring.datasource.hikari.maximumPoolSize=${POOL_MAXSIZE}

# --- AWS INTEGRATION ---
cloud.aws.accessKey=${CLOUD_ACCESSKEY}
cloud.aws.secretKey=${CLOUD_SECRETKEY}
cloud.aws.keypair=${KEY_PAIR}